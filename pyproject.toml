[project]
name = "leadpro"
version = "0.1.0"
description = "Evidence-based qualified B2B lead research engine"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "dnspython>=2.7",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "htmldate>=1.9",
    "httpx>=0.28",
    "jinja2>=3.1",
    "openai>=3.41.0",
    "openpyxl>=3.1",
    "phonenumbers>=9.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=6",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tldextract>=5.1",
    "trafilatura>=2.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
leadpro = "app.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["app/migrations"]  # generated by Alembic
line-length = 110             # this codebase favours explanatory one-line comments; enforced by the formatter
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear: likely bugs and design problems
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "C4",      # comprehensions
    "N",       # pep8-naming
    "PT",      # pytest style
    "RET",     # return statements
    "ASYNC",   # blocking calls inside async code
    "S",       # bandit security checks
]
ignore = [
    "E501",    # line length: the formatter owns it
    "B008",    # FastAPI Depends()/Form() defaults
    "RUF001", "RUF002", "RUF003",  # intentional typographic characters (₹, quotes) in user-facing text
    "S101",    # assert is fine outside tests where used as a type guard
    "S311",    # random is used for retry jitter, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S", "N802", "PT011"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
