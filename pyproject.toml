[project]
name = "leadpro"
version = "0.1.0"
description = "Evidence-based qualified B2B lead research engine"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "dnspython>=2.7",
    "htmldate>=1.9",
    "httpx>=0.28",
    "openai>=3.41.0",
    "openpyxl>=3.1",
    "phonenumbers>=9.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tldextract>=5.1",
    "trafilatura>=2.0",
    "typer>=0.15",
]

[project.scripts]
leadpro = "app.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
